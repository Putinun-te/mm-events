name: CI

# Runs on GitHub-hosted runners only. No cloud credentials and no deploy jobs:
# the AWS infrastructure used during the course has been decommissioned.
# Backend tests live in backend-ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main_frontend/concert1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main_frontend/concert1/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run build

  e2e:
    # Job name is a required status check; keep it when changing the steps.
    name: API end-to-end (Docker Compose)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main_frontend/concert1/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('main_frontend/concert1/package-lock.json') }}

      # Install before starting Compose: the frontend service mounts an anonymous volume
      # at node_modules, and on Linux Docker would otherwise create that directory on the
      # host as root, so a later npm ci fails with EACCES.
      - name: Install e2e test dependencies
        working-directory: main_frontend/concert1
        run: npm ci --legacy-peer-deps

      - name: Start MySQL, backend and frontend
        run: |
          docker compose up -d --build --wait --wait-timeout 400 mysql backend frontend
          # the frontend container runs npm install + nuxt dev on start
          for i in $(seq 1 60); do curl -fs http://localhost:3000 >/dev/null && break; sleep 5; done
          curl -fsS -o /dev/null http://localhost:3000

      - name: Run API e2e tests
        working-directory: main_frontend/concert1
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8080
        run: npm run test:e2e

      - name: Run Cypress UI tests
        working-directory: main_frontend/concert1
        run: npx cypress run --browser electron

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: main_frontend/concert1/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Backend logs
        if: failure()
        run: docker compose logs backend mysql frontend

      - name: Stop containers
        if: always()
        run: docker compose down -v

  docker-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t mm-events-backend:ci main_backend
      - name: Build frontend image
        run: docker build -t mm-events-frontend:ci main_frontend/concert1

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
