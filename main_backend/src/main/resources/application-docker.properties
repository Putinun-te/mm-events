# Docker MySQL Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/concert_db
spring.datasource.username=concert_user
spring.datasource.password=concert_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable H2 console for production
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=dev-only-jwt-secret-change-me-before-any-deployment-dev-only-jwt-secret-change-me
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# AWS S3 Configuration for Docker profile
aws.s3.event-pictures-bucket=docker-test-bucket
aws.s3.user-avatars-bucket=docker-test-avatars
aws.region=us-east-1
aws.s3.presigned-urls-enabled=false
aws.s3.public-access=true

# Logging
logging.level.com.concert=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator for health checks and monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# CORS Configuration for Docker
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
