{{- $es := .Values.secrets.externalSecrets -}}
{{- if $es.enabled }}
{{- if not $es.provider }}
{{- fail "secrets.externalSecrets.provider is required (use the Terraform output helm_values)" }}
{{- end }}
{{- if or (not $es.dbPassword.key) (not $es.jwtSecret.key) }}
{{- fail "secrets.externalSecrets.dbPassword.key and jwtSecret.key are required" }}
{{- end }}
{{- $store := printf "%s-store" (include "mm-events.fullname" .) -}}
# Reads from the cloud's secret store with the backend service account's cloud identity
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
spec:
  provider:
    {{- toYaml $es.provider | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mm-events.secretName" . }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $store }}
  target:
    name: {{ include "mm-events.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ $es.dbPassword.key | quote }}
        {{- with $es.dbPassword.property }}
        property: {{ . | quote }}
        {{- end }}
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ $es.jwtSecret.key | quote }}
        {{- with $es.jwtSecret.property }}
        property: {{ . | quote }}
        {{- end }}
{{- end }}
