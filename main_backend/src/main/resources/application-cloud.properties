# Profile for hosted deployments (SPRING_PROFILES_ACTIVE=cloud), used by the Helm chart in
# deploy/. Every value comes from environment variables; nothing secret has a default.

# The platform routes traffic to the port in $PORT
server.port=${PORT:8080}
# Client address from the platform's proxy headers (used by the login rate limit)
server.forward-headers-strategy=native

# Managed MySQL 8, e.g. jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED; no defaults on purpose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# small: free database plans allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Required: at least 64 characters (HS512). Startup fails if it is missing.
jwt.secret=${JWT_SECRET}
# Access token lifetime in ms (15 minutes) and refresh token lifetime in days
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:14}

# Browser origins allowed to call the API; set APP_CORS_ALLOWED_ORIGINS to the site's origin
# (the Helm chart does). The default is the same as for local Docker Compose.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Health check on the same port, without details. Redis is not used by the code,
# so its health indicator would only report DOWN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.redis.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=WARN
logging.level.com.concert=INFO

# Photo uploads to S3 are not available in the demo (no AWS account).
aws.region=${AWS_REGION:ap-southeast-1}
