name: terraform

# Static checks for the Terraform modules in deploy/terraform. No cloud credentials:
# 'init -backend=false' and 'validate' never contact AWS, Google Cloud or Azure.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'deploy/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: hashicorp/terraform:1.16
    steps:
      - uses: actions/checkout@v7
      - run: terraform fmt -check -recursive -diff deploy/terraform

  validate:
    name: terraform validate (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: hashicorp/terraform:1.16
    strategy:
      fail-fast: false
      matrix:
        module: [aws, gcp, azure]
    defaults:
      run:
        working-directory: deploy/terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - run: terraform init -backend=false -input=false
      - run: terraform validate
