# Render Blueprint for the free demo backend (https://render.com/docs/blueprint-spec).
# Render -> New -> Blueprint -> pick this repository. Values marked sync: false are asked
# for once in the dashboard and never stored in git. Step-by-step: docs/DEPLOY.md.
services:
  - type: web
    name: mm-events-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: main_backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - main_backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      # The free instance has 512 MB: size the heap from the container limit, small thread stacks
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:mysql://<aiven host>:<port>/defaultdb?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false # at least 64 characters, e.g. openssl rand -base64 64
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://putinun-te.github.io
