# Production Configuration
server.port=8080

# Database Configuration (environment variables will override these)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/concert}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
# Required, at least 64 characters; no default so a missing secret stops startup
jwt.secret=${JWT_SECRET}
# Access token lifetime in ms (15 minutes) and refresh token lifetime in days
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:14}

# Actuator for production monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# Security settings
server.error.include-stacktrace=never
server.error.include-message=never

# Logging for production
logging.level.root=WARN
logging.level.com.concert=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# CORS: required, the frontend's origin(s), e.g. https://putinun-te.github.io
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# No API explorer in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# AWS S3 Configuration for Production
# Use environment variables for production credentials
aws.region=${AWS_REGION:us-east-1}
aws.s3.event-pictures-bucket=${AWS_S3_EVENT_PICTURES_BUCKET:my-event-pictures-bucket}
aws.s3.user-avatars-bucket=${AWS_S3_USER_AVATARS_BUCKET:my-user-avatars-bucket}
aws.s3.presigned-urls-enabled=${AWS_S3_PRESIGNED_URLS_ENABLED:true}
aws.s3.expiration-minutes=${AWS_S3_EXPIRATION_MINUTES:60}
aws.s3.public-access=${AWS_S3_PUBLIC_ACCESS:false}
