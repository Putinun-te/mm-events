name: deploy-pages

# Builds the Nuxt frontend as a static site and publishes it to GitHub Pages.
# Needs (see docs/DEPLOY.md):
#   - Settings > Pages > Source: "GitHub Actions"
#   - repository variable BACKEND_BASE_URL, e.g. https://mm-events-api.onrender.com

on:
  push:
    branches: [main]
    paths:
      - 'main_frontend/concert1/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skipped on pushes until BACKEND_BASE_URL is set; a manual run explains what is missing.
    if: ${{ vars.BACKEND_BASE_URL != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: main_frontend/concert1
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::error::Set the repository variable BACKEND_BASE_URL (Settings > Secrets and variables > Actions > Variables) to the backend URL (e.g. https://mm-events-api.onrender.com)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: main_frontend/concert1/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Build static site
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: npx nuxt generate

      - uses: actions/upload-pages-artifact@v5
        with:
          path: main_frontend/concert1/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
