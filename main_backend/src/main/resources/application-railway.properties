# Profile for the Railway live demo (SPRING_PROFILES_ACTIVE=railway).
# Every value comes from the Railway service's variables; see docs/DEPLOY.md.

# Railway routes traffic to the port in $PORT
server.port=${PORT:8080}

# MySQL from the Railway MySQL service (reference variables), no defaults on purpose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Required: at least 64 characters (HS512). Startup fails if it is missing.
jwt.secret=${JWT_SECRET}

# Health check on the same port, without details. Redis is not used by the code,
# so its health indicator would only report DOWN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.redis.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=WARN
logging.level.com.concert=INFO

# Photo uploads to S3 are not available in the demo (no AWS account).
aws.region=${AWS_REGION:ap-southeast-1}
