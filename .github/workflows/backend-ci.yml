name: backend-ci

# Backend tests on GitHub-hosted runners. No cloud credentials, no secrets,
# no deploy steps.
#
# Path filtering happens inside the workflow (job "changes") rather than with
# on.paths, so the final "backend-ci" job always reports a status and can be
# used as a required check: it passes when the backend did not change.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'main_backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/backend-ci.yml'
              - '.github/scripts/backend_test_summary.py'

  tests:
    name: Unit and integration tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: main_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Unit tests (surefire, no Docker)
        run: ./mvnw -B -ntp test

      - name: Integration tests and coverage gate (failsafe, Testcontainers MySQL 8.0)
        run: ./mvnw -B -ntp verify -DskipUTs=true

      - name: Test and coverage summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/backend_test_summary.py main_backend >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            main_backend/target/surefire-reports/
            main_backend/target/failsafe-reports/
            main_backend/target/site/jacoco/
            main_backend/target/site/jacoco-unit/
          if-no-files-found: ignore
          retention-days: 14

  backend-ci:
    name: backend-ci
    needs: [changes, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report result
        run: |
          echo "changes job: ${{ needs.changes.result }}, backend changed: ${{ needs.changes.outputs.backend }}, tests: ${{ needs.tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.tests.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
