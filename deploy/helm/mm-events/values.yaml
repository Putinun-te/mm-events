# Default values for the mm-events chart.
#
# Install per cloud with three layers of values:
#   -f values-<cloud>.yaml            static settings for the cloud (ingress class, annotations)
#   -f <terraform output helm_values>  IDs and hostnames from that cloud's Terraform module
#   --set backend.image.tag=...        whatever you change per release
#
# No secret values belong in any values file: the database password and the JWT secret are
# copied from the cloud's secret store into a Kubernetes Secret by the External Secrets
# Operator (see `secrets` below).

nameOverride: ""
fullnameOverride: ""

# Public URL of the site, e.g. http://k8s-mmevents-xxxx.ap-southeast-1.elb.amazonaws.com or
# https://events.example.com. Used for APP_CORS_ALLOWED_ORIGINS. Frontend and API share this
# origin through the ingress, so CORS only matters for other sites calling the API.
publicUrl: ""

backend:
  image:
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent

  # Used when autoscaling is off
  replicas: 2

  # The 'cloud' profile reads port, datasource, JWT secret and CORS origin from the
  # environment, so it works on any platform (see application-cloud.properties).
  springProfile: cloud

  datasource:
    host: ""
    port: 3306
    database: concert_db
    username: concert
    # Encrypted connection to the managed database
    params: sslMode=REQUIRED

  javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

  # Extra environment variables, as a list of EnvVar objects
  extraEnv: []

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1Gi

  # Spring Boot + Flyway take a while on the first start
  startupProbe:
    httpGet:
      path: /actuator/health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  service:
    port: 80
    annotations: {}

  # The cloud identity (IRSA role, GCP service account, Azure managed identity) is attached
  # to this service account. Terraform trusts exactly this name in the release namespace.
  serviceAccount:
    create: true
    name: mm-events-backend
    annotations: {}
    labels: {}

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  # Static Nuxt build served by nginx (main_frontend/concert1/Dockerfile). The image must be
  # built with NUXT_PUBLIC_BACKEND_BASE_URL set to publicUrl.
  enabled: true
  image:
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    port: 80
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

secrets:
  # Name of the Kubernetes Secret holding SPRING_DATASOURCE_PASSWORD and JWT_SECRET.
  # Empty = "<release fullname>-backend", created by the ExternalSecret below.
  name: ""

  externalSecrets:
    # Needs the External Secrets Operator in the cluster. Set to false to provide the
    # Secret yourself (kubectl create secret generic ... --from-literal=...).
    enabled: true
    refreshInterval: 1h
    # SecretStore spec.provider for the cloud's secret store (set by the Terraform output)
    provider: {}
    # Where the two values live in the secret store
    dbPassword:
      key: ""
      property: ""
    jwtSecret:
      key: ""
      property: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  # Empty = any host (the load balancer's own address)
  host: ""
  tls: []
  # Sent to the backend; everything else goes to the frontend
  apiPaths:
    - /api
    - /actuator/health
    - /swagger-ui
    - /swagger-ui.html
    - /v3/api-docs

# GKE Ingress: a BackendConfig per Service sets the load balancer health check to the
# readiness endpoint (/actuator/health, /health) and enables container-native load balancing.
gkeBackendConfig:
  enabled: false

# Application Gateway for Containers (AKS) probes "/" unless told otherwise. When enabled,
# a HealthCheckPolicy points it at the readiness endpoints of both services.
azureAlbHealthCheckPolicy:
  enabled: false
