server.port=8080

# Default MySQL Configuration (for local development)
spring.datasource.url=jdbc:mysql://localhost:3306/devop_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=dev-only-jwt-secret-change-me-before-any-deployment-dev-only-jwt-secret-change-me
jwt.expiration=604800

# CORS Configuration (handled by CorsConfig.java and SecurityConfig.java)
# Commented out to avoid conflicts with programmatic CORS configuration
#spring.web.cors.allowed-origins=*
#spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
#spring.web.cors.allowed-headers=*

# Logging
logging.level.com.concert=DEBUG

# Logging
logging.level.com.concert=DEBUG

# AWS Configuration (override via environment variables in production)
# Use AWS_ prefix for environment variables: AWS_REGION, AWS_S3_EVENT_PICTURES_BUCKET
aws.region=${AWS_REGION:us-east-1}
aws.s3.event-pictures-bucket=${AWS_S3_EVENT_PICTURES_BUCKET:concert-event-pictures}
aws.s3.presigned-urls-enabled=${AWS_S3_PRESIGNED_URLS_ENABLED:true}
aws.s3.presigned-url-expiration-minutes=${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:60}
aws.s3.public-access=${AWS_S3_PUBLIC_ACCESS:false}
