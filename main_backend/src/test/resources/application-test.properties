# Test profile overrides
# NOTE: This file is used only during tests (-Dspring.profiles.active=test)
# Provide a strong JWT secret (>=256 bits) to satisfy JJWT requirements.
jwt.secret=test-only-jwt-secret-used-by-unit-tests-test-only-jwt-secret-used-by-unit-tests
jwt.expiration=604800000
# Test Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Configuration for tests
app.jwtSecret=testSecretKeyThatIsAtLeast512BitsLongForHS512AlgorithmSecurityRequirements1234567890
app.jwtExpirationInMs=3600000
