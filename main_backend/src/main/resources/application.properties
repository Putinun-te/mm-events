server.port=8080

# MySQL Configuration (override via environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/devop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# The schema comes from Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway: databases created by Hibernate before Flyway are adopted at version 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Configuration
jwt.secret=dev-only-jwt-secret-change-me-before-any-deployment-dev-only-jwt-secret-change-me
# Token lifetime in milliseconds (default 24 hours)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}


# Logging
logging.level.com.concert=DEBUG

# AWS Configuration (override via environment variables in production)
# Use AWS_ prefix for environment variables: AWS_REGION, AWS_S3_EVENT_PICTURES_BUCKET
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.event-pictures-bucket=${AWS_S3_EVENT_PICTURES_BUCKET:concert-event-pictures-singapore-123456789012}
aws.s3.user-avatars-bucket=${AWS_S3_USER_AVATARS_BUCKET:concert-user-avatars-singapore-123456789012}
aws.s3.images-url=${AWS_S3_IMAGES_URL:https://concert-event-pictures-singapore-123456789012.s3.ap-southeast-1.amazonaws.com}
aws.s3.presigned-urls-enabled=${AWS_S3_PRESIGNED_URLS_ENABLED:true}
aws.s3.presigned-url-expiration-minutes=${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:60}
aws.s3.public-access=${AWS_S3_PUBLIC_ACCESS:false}

# Browser origins allowed to call the API (comma-separated, patterns like http://localhost:[*] allowed)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Failed logins per client address + account before a 15-minute lockout
app.login.max-failures=5
app.login.lockout-minutes=15
