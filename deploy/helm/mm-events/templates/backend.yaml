{{- $name := include "mm-events.backendName" . -}}
{{- $b := .Values.backend -}}
{{- if not $b.datasource.host }}
{{- fail "backend.datasource.host is required" }}
{{- end }}
{{- if $b.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mm-events.backendServiceAccountName" . }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
    {{- with $b.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $b.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not $b.autoscaling.enabled }}
  replicas: {{ $b.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "mm-events.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "mm-events.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with $b.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $b.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mm-events.backendServiceAccountName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mm-events.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      containers:
        - name: backend
          image: {{ include "mm-events.image" (dict "image" $b.image "component" "backend") }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $b.springProfile | quote }}
            - name: PORT
              value: "8080"
            - name: JAVA_OPTS
              value: {{ $b.javaOpts | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:mysql://%s:%v/%s?%s" $b.datasource.host $b.datasource.port $b.datasource.database $b.datasource.params | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ $b.datasource.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mm-events.secretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mm-events.secretName" . }}
                  key: JWT_SECRET
            {{- with .Values.publicUrl }}
            - name: APP_CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $b.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Tomcat and the JVM write temporary files here
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with (include "mm-events.serviceAnnotations" (dict "root" $ "name" $name "annotations" $b.service.annotations)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "mm-events.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $b.service.port }}
      targetPort: http
      protocol: TCP
{{- if $b.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $b.autoscaling.minReplicas }}
  maxReplicas: {{ $b.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $b.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if $b.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "mm-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ $b.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mm-events.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
{{- end }}
