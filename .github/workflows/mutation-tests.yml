name: mutation-tests

# PIT mutation testing of the backend's business logic (services, security,
# error mapping). Fails when the mutation score drops below the gate in
# main_backend/pom.xml (profile "mutation"). Not a required check.

on:
  pull_request:
    paths:
      - 'main_backend/**'
      - '.github/workflows/mutation-tests.yml'
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pit:
    name: PIT mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: main_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PIT
        run: ./mvnw -B -ntp -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage -Djacoco.skip=true

      - name: Mutation summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/mutation_summary.py main_backend >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: main_backend/target/pit-reports/
          if-no-files-found: ignore
          retention-days: 14
